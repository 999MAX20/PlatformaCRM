name: CRM Android JVM diagnostic

on:
  workflow_dispatch:
  push:
    branches: ["codex/mobile-max"]
    paths: [".github/workflows/mobile-android-jvm.yml"]

permissions:
  contents: read

concurrency:
  group: crm-android-jvm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android-jvm:
    name: Android debug compilation and fixture JVM tests
    if: github.ref == 'refs/heads/codex/mobile-max'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: One bounded Android JVM attempt
        timeout-minutes: 18
        run: python3 mobile/scripts/run_android_jvm_checks.py "$RUNNER_TEMP/crm-android-jvm"
      - name: Preserve diagnostic evidence
        if: ${{ always() && !cancelled() }}
        timeout-minutes: 1
        uses: actions/upload-artifact@v4
        with:
          name: crm-android-jvm-${{ github.sha }}
          path: |
            ${{ runner.temp }}/crm-android-jvm/report.json
            ${{ runner.temp }}/crm-android-jvm/inputs.json
            ${{ runner.temp }}/crm-android-jvm/*.log
            mobile/android/app/build/test-results/testDebugUnitTest/
            mobile/android/app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: error
          retention-days: 3
