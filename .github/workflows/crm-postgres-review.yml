name: CRM PostgreSQL compatibility review

on:
  workflow_dispatch:
  push:
    branches: ["codex/crm-postgres-compat-review"]
    paths: [".github/workflows/crm-postgres-review.yml"]

permissions:
  contents: read

concurrency:
  group: backend-targeted-${{ github.ref }}
  cancel-in-progress: false

jobs:
  diagnostic:
    if: github.ref == 'refs/heads/codex/crm-postgres-compat-review'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: One bounded isolated diagnostic
        timeout-minutes: 18
        run: python3 mobile/scripts/run_crm_followup_diagnostic.py "$RUNNER_TEMP/crm-backend-targeted" --mode backend-targeted
      - name: Preserve sanitized evidence
        if: ${{ always() && !cancelled() }}
        timeout-minutes: 1
        uses: actions/upload-artifact@v4
        with:
          name: crm-backend-targeted-${{ github.sha }}
          path: ${{ runner.temp }}/crm-backend-targeted/public/
          if-no-files-found: error
          retention-days: 3
