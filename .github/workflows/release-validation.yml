name: Release validation

on:
  workflow_dispatch:
    inputs:
      base_ref:
        description: Deployed ancestor commit to validate against
        required: true
        type: string

permissions:
  contents: read

jobs:
  full-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked verification tools
        run: |
          python -m pip install --require-hashes -r requirements.txt -r requirements-dev.txt
          npm ci --prefix frontend
          cd frontend
          npx playwright install --with-deps chromium
      - name: Full isolated release gate
        env:
          BASE_REF: ${{ inputs.base_ref }}
        run: |
          set -o pipefail
          python scripts/codex_verify.py --mode full --base-ref "$BASE_REF" 2>&1 | tee release-validation.log
      - name: Patched glob regression
        run: node --test frontend/scripts/tests/picomatch-security.test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-validation
          path: |
            release-validation.log
            frontend/playwright-report
          retention-days: 14
