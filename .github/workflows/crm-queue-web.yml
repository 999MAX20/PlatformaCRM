name: CRM independent queue and web diagnostic

on:
  workflow_dispatch:
  push:
    branches: ["codex/mobile-max"]
    paths: [".github/workflows/crm-queue-web.yml"]

permissions:
  contents: read

concurrency:
  group: queue-web-${{ github.ref }}
  cancel-in-progress: false

jobs:
  diagnostic:
    if: github.ref == 'refs/heads/codex/mobile-max'
    runs-on: ubuntu-24.04
    timeout-minutes: 950
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: One bounded isolated diagnostic
        timeout-minutes: 95
        run: python3 mobile/scripts/run_crm_followup_diagnostic.py "$RUNNER_TEMP/crm-queue-web" --mode queue-web
      - name: Preserve sanitized evidence
        if: ${{ always() && !cancelled() }}
        timeout-minutes: 1
        uses: actions/upload-artifact@v4
        with:
          name: crm-queue-web-${{ github.sha }}
          path: ${{ runner.temp }}/crm-queue-web/public/
          if-no-files-found: error
          retention-days: 3
